name: EuroOffice-first browser WASM build (experimental)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional EuroOffice stable release tag. Leave empty for latest stable.'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: eurooffice-first-browser-pages
  cancel-in-progress: false

jobs:
  compile-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ranuts/document
          ref: 1301bb8bdac9092c4eb88a6f2f4ff5080cec68bd
          path: .work/ranuts
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.4.0'
          run_install: false
      - name: Verify all scripts and policy checks
        run: |
          bash -n scripts/*.sh
          python3 -m py_compile scripts/*.py
          for f in scripts/*.mjs site/poc.js; do node --check "$f"; done
          node --test tests/*.test.mjs
      - name: Resolve official EuroOffice release
        env:
          GH_TOKEN: ${{ github.token }}
          EO_REQUESTED_TAG: ${{ inputs.release_tag }}
        run: node scripts/resolve-release.mjs
      - name: Checkout EXACT EuroOffice DocumentServer core gitlink
        run: bash scripts/prepare-release-core.sh
      - name: Show build environment and available disk
        run: |
          docker buildx version
          df -h .
          echo 'Building upstream EuroOffice C++ in Emscripten may exceed standard runners.'
      - name: Compile release-matched x2t with EuroOffice-first source
        run: bash scripts/build-matching-wasm.sh
      - name: Verify compiled binary pair before acquiring Debian package
        run: node scripts/check-converter-pair.mjs .work/matching-converter
      - name: Identify official AMD64 Debian package by internal metadata
        run: node scripts/select-release-deb.mjs
      - name: Assemble source-matched browser editor
        run: bash scripts/build-poc.sh
      - name: Verify final deployable editor and provenance
        run: |
          node scripts/verify-site.mjs dist
          node scripts/check-converter-pair.mjs dist/office/sdkjs/common/wasm/x2t
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const x=JSON.parse(readFileSync("dist/office/eurooffice-poc-build.json")); if(x.upstreamReleaseTag!==process.env.EO_RELEASE_TAG||x.mixedVersionExperiment||x.converterSourceMode!=="official-eurooffice-first"||!x.converterCoreCommit) process.exit(1);'
      - uses: actions/configure-pages@v5
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy browser-only prototype
        uses: actions/deploy-pages@v4
        id: deployment
      - name: Preserve compiler and source provenance on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eurooffice-first-build-diagnostics
          retention-days: 21
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .work/release-candidates.json
            .work/official-core-commit.txt
            .work/official-core-staging.json
            .work/build-recipe-report.json
            .work/diagnostics/
      - name: Publish readable build summary
        if: always()
        run: |
          {
            echo '## EuroOffice-first WASM experiment'
            echo "- Release: ${EO_RELEASE_TAG:-not resolved}"
            echo "- Official core: $(cat .work/official-core-commit.txt 2>/dev/null || echo unavailable)"
            echo '- C++ source: exact EuroOffice DocumentServer gitlink, never the older CryptPad modified core.'
            echo '- Build recipe: pinned CryptPad toolchain with a separately documented Docker adapter.'
            echo '- No previous WASM binary is accepted as a fallback.'
            echo '- A failed compiler run is an unresolved upstream compatibility issue, not a successful converter.'
            if [ -f .work/official-core-staging.json ]; then
              python3 -c 'import json; x=json.load(open(".work/official-core-staging.json")); print("- Explicit EuroOffice source patches:", x["patchCount"])'
            fi
            if [ -f .work/diagnostics/docker-build-tail.log ]; then
              echo '- Compiler tail saved in **eurooffice-first-build-diagnostics** artifact (when uploaded).'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
