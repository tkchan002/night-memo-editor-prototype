name: Deploy Nurse Memo Document Test

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify HTML, JavaScript and DOCX fixtures
        run: |
          node --check assets/app.js
          python3 tests/check_project.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static website
        run: |
          mkdir -p _site/assets _site/fixtures
          cp index.html _site/
          cp assets/app.js assets/style.css _site/assets/
          cp fixtures/*.docx _site/fixtures/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
