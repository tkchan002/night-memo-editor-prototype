name: EuroOffice Latest Stable - Browser-only Experiment

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional official tag, e.g. v9.3.5. Leave blank for latest stable at run time.'
        required: false
        default: ''
        type: string
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: eurooffice-latest-experiment-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout experiment files
        uses: actions/checkout@v4
      - name: Checkout EXACT pinned Ranuts source (do not auto-upgrade)
        uses: actions/checkout@v4
        with:
          repository: Ranuts/document
          ref: 1301bb8bdac9092c4eb88a6f2f4ff5080cec68bd
          path: .work/ranuts
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.4.0'
          run_install: false
      - name: Run local tests before downloading a large release
        run: |
          bash -n scripts/build-poc.sh
          node --check scripts/resolve-release.mjs
          node --test tests/*.test.mjs
      - name: Resolve latest STABLE official release and exact amd64 asset
        env:
          GH_TOKEN: ${{ github.token }}
          EO_REQUESTED_TAG: ${{ inputs.release_tag }}
        run: node scripts/resolve-release.mjs
      - name: Assemble browser-only EuroOffice from selected official release
        env:
          GH_TOKEN: ${{ github.token }}
          EUROOFFICE_DEB_SHA256: ${{ vars.EUROOFFICE_DEB_SHA256 }}
        run: bash scripts/build-poc.sh
      - name: Verify selected release matches finished static site
        run: |
          node scripts/verify-site.mjs dist
          node -e 'const fs=require("fs"); const m=require("./dist/office/eurooffice-poc-build.json"); if (m.upstreamReleaseTag!==process.env.EO_RELEASE_TAG || !m.mixedVersionExperiment) process.exit(1); console.log("Validated:",m.upstreamReleaseTag,"converter:",m.browserConverterVersion);'
      - name: Publish selected versions in the Actions summary
        run: |
          {
            echo '## EuroOffice automatic release build'
            echo "- Official editor release: **${EO_RELEASE_TAG}**"
            echo "- Downloaded asset: ${EO_DEB_NAME}"
            echo '- Browser-only converter: **9.3.5-rc.1.build.1 (pinned, not automatically upgraded)**'
            echo '- Compatibility: **experimental, requires browser DOCX/PDF round-trip tests**'
            echo '- Provenance file: `office/eurooffice-poc-build.json`'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the validated prototype
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to dedicated experimental Pages site
        uses: actions/deploy-pages@v4
        id: deployment
