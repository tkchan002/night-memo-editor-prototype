name: EuroOffice Browser-only Proof of Concept

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Optional: configure repository variable EUROOFFICE_DEB_SHA256 only after
  # independently checking the official release digest.
  EUROOFFICE_DEB_SHA256: ${{ vars.EUROOFFICE_DEB_SHA256 }}

concurrency:
  group: eurooffice-poc-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout proof-of-concept scripts
        uses: actions/checkout@v4
      - name: Checkout exact Ranuts source used by package publisher
        uses: actions/checkout@v4
        with:
          repository: Ranuts/document
          ref: 1301bb8bdac9092c4eb88a6f2f4ff5080cec68bd
          path: .work/ranuts
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.4.0'
          run_install: false
      - name: Check proof-of-concept scripts
        run: |
          bash -n scripts/build-poc.sh
          node --test tests/*.test.mjs
      - name: Fetch verified inputs, assemble offline editor, and build site
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/build-poc.sh
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload validated static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy standalone prototype
        id: deployment
        uses: actions/deploy-pages@v4
